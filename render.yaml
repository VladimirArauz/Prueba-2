# =========================================================
# NECUTLA — Blueprint de Render
# Crea el servicio web y la base de datos PostgreSQL juntos.
# Render > New > Blueprint > elige este repositorio.
# =========================================================

services:
  - type: web
    name: necutla
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: necutla-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Estas tres se piden al crear el Blueprint (no se guardan en git)
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Respaldo para las tiendas que no tengan números propios en Necutools
      - key: WHATSAPP_NUMBERS
        sync: false
      # HOY_PRUEBA (fecha simulada para probar ofertas) es solo de desarrollo: no se define aquí

databases:
  - name: necutla-db
    plan: free
    region: oregon
    databaseName: necutla
    user: necutla
    # Quién puede conectarse desde fuera (pgAdmin). 0.0.0.0/0 = cualquier IP de internet: solo la
    # protege la contraseña. Restríngelo en el panel de Render (necutla-db → Networking → Access Control)
    # a tu IP con /32 (búscala en https://ifconfig.me). No la escribas aquí: este archivo es público.
    # Si lo dejas vacío ([]), nadie se conecta desde fuera y el sitio sigue funcionando (usa la red interna).
    ipAllowList:
      - source: 0.0.0.0/0
        description: Acceso externo (restringir a tu IP desde el panel de Render)
