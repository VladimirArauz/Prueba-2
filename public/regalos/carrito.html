<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrito - Regalos</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body data-store="regalos" data-store-name="Regalos">
  <header class="page-bar">
    <div class="container page-bar-inner">
      <a class="nav-brand" href="../index.html">
        <span class="brand-emblem" aria-hidden="true">N</span>
        <span class="brand-text-wrap">
          <span class="brand-title">Necutla</span>
          <span class="brand-badge">Ciudad del Estudiante</span>
        </span>
      </a>
      <nav class="page-bar-actions" aria-label="Navegación de la tienda">
        <a class="btn secondary btn-sm" href="index.html"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>Regalos</a>
        <span class="btn ghost btn-sm" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#i-shopping-cart"></use></svg><span>Carrito</span><span class="cart-pill cart-count">0</span></span>
      </nav>
    </div>
  </header>

  <main class="page-main">
    <div class="container">
      <div class="page-head">
        <h1>Carrito de Regalos</h1>
        <p>Revisa tu pedido de Regalos y envíalo por WhatsApp.</p>
      </div>
      <div class="store-cart">
        <div class="cart-items-card">
          <div id="cart-items"></div>
        </div>
        <aside class="cart-summary-card">
          <h3>Resumen del pedido</h3>
          <div class="total-display">
            <span class="total-label">Total</span>
            <span class="total-amount" id="cart-total">$0.00 MXN</span>
          </div>
          <div class="cart-summary-fields">
            <div class="form-group">
              <label for="customer-name">Tu nombre (opcional)</label>
              <input id="customer-name" placeholder="Ej. Juan Pérez" autocomplete="name">
            </div>
            <div class="form-group">
              <label for="customer-notes">Indicaciones</label>
              <textarea id="customer-notes" rows="3" placeholder="Tallas, colores o cómo quieres recibirlo"></textarea>
            </div>
          </div>
          <div class="cart-summary-actions">
            <button type="button" class="btn wa btn-block" data-action="send-order"><svg class="icon" aria-hidden="true"><use href="#i-message-circle"></use></svg>Enviar pedido por WhatsApp</button>
            <button type="button" class="btn danger btn-block" data-action="cart-clear"><svg class="icon" aria-hidden="true"><use href="#i-trash-2"></use></svg>Vaciar carrito</button>
          </div>
          <div class="notice">
            <svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg>
            <span>Se abrirán los chats de WhatsApp de Necutla con tu pedido escrito. En cada uno solo pulsa “Enviar”.</span>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <script src="../iconos.js"></script>
  <script src="js/carrito.js"></script>
</body>
</html>
