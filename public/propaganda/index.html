<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Propaganda</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body data-store="propaganda" data-store-name="Propaganda">
  <header class="page-bar">
    <div class="container page-bar-inner">
      <a class="nav-brand" href="../index.html">
        <span class="brand-emblem" aria-hidden="true">N</span>
        <span class="brand-text-wrap">
          <span class="brand-title">Necutla</span>
          <span class="brand-badge">Ciudad del Estudiante</span>
        </span>
      </a>
      <nav class="page-bar-actions" aria-label="Navegación de la tienda">
        <a class="btn secondary btn-sm" href="../index.html"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>Tiendas</a>
        <a class="btn ghost btn-sm" href="carrito.html"><svg class="icon" aria-hidden="true"><use href="#i-shopping-cart"></use></svg><span>Carrito</span><span class="cart-pill cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main class="page-main">
    <div class="container">
      <div class="page-head">
        <h1><svg class="icon" aria-hidden="true"><use href="#i-megaphone"></use></svg>Propaganda</h1>
        <p>Elige una categoría para ver sus productos.</p>
      </div>
      <section class="grid">
      <article class="card">
        <div class="card-img-wrap"><img src="imagenes/impresiones.svg" alt="Impresiones" loading="lazy"></div>
        <h3>Impresiones</h3>
        <a class="btn" href="impresiones/index.html">Ver productos</a>
      </article>
      <article class="card">
        <div class="card-img-wrap"><img src="imagenes/volantes.svg" alt="Volantes" loading="lazy"></div>
        <h3>Volantes</h3>
        <a class="btn" href="volantes/index.html">Ver productos</a>
      </article>
      <article class="card">
        <div class="card-img-wrap"><img src="imagenes/promocionales.svg" alt="Promocionales" loading="lazy"></div>
        <h3>Promocionales</h3>
        <a class="btn" href="promocionales/index.html">Ver productos</a>
      </article>
      </section>
    </div>
  </main>

  <script src="../iconos.js"></script>
  <script src="js/carrito.js"></script>
</body>
</html>
