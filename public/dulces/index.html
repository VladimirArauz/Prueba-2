<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dulces</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body data-store="dulces" data-store-name="Dulces">
  <header class="page-bar">
    <div class="container page-bar-inner">
      <a class="nav-brand" href="../index.html">
        <span class="brand-emblem" aria-hidden="true">N</span>
        <span class="brand-text-wrap">
          <span class="brand-title">Necutla</span>
          <span class="brand-badge">Ciudad del Estudiante</span>
        </span>
      </a>
      <nav class="page-bar-actions" aria-label="Navegación de la tienda">
        <a class="btn secondary btn-sm" href="../index.html"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>Tiendas</a>
        <a class="btn ghost btn-sm" href="carrito.html"><svg class="icon" aria-hidden="true"><use href="#i-shopping-cart"></use></svg><span>Carrito</span><span class="cart-pill cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main class="page-main">
    <div class="container">
      <div class="page-head">
        <h1><svg class="icon" aria-hidden="true"><use href="#i-candy"></use></svg>Dulces</h1>
        <p>Elige una categoría para ver sus productos.</p>
      </div>
      <section class="grid">
      <article class="card">
        <div class="card-img-wrap"><img src="imagenes/chocolates.svg" alt="Chocolates" loading="lazy"></div>
        <h3>Chocolates</h3>
        <a class="btn" href="chocolates/index.html">Ver productos</a>
      </article>
      <article class="card">
        <div class="card-img-wrap"><img src="imagenes/gomitas.svg" alt="Gomitas" loading="lazy"></div>
        <h3>Gomitas</h3>
        <a class="btn" href="gomitas/index.html">Ver productos</a>
      </article>
      <article class="card">
        <div class="card-img-wrap"><img src="imagenes/paletas.svg" alt="Paletas" loading="lazy"></div>
        <h3>Paletas</h3>
        <a class="btn" href="paletas/index.html">Ver productos</a>
      </article>
      </section>
    </div>
  </main>

  <script src="../iconos.js"></script>
  <script src="js/carrito.js"></script>
</body>
</html>
