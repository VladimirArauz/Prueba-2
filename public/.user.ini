; Ajustes de PHP para Necutla (PHP-FPM lee este archivo en IONOS y en local; Apache no lo sirve: empieza con punto).
; Plan 2026-10-31-seguridad-turnstile-y-cloudflare-aparte.
; El progreso de subidas de sesión no se usa y es la mitigación que se sugirió para PHP2Shell (CVE-2026-109618/109619).
session.upload_progress.enabled = 0
; Los errores van al log, nunca a la pantalla (app/arranque.php también lo pide)
display_errors = 0
display_startup_errors = 0
log_errors = 1
; Las cookies de sesión de PHP no se usan (la sesión es propia, app/sesiones.php), pero por si acaso
session.use_strict_mode = 1
session.cookie_httponly = 1
