<!doctype html>
<!-- Fuente de los iconos de Necutla (plan 2026-10-31-seo-iconos-contenido-y-legal). No se publica.
     Se abre con Chrome sin ventana: icono.html#TAMAÑO,MODO (MODO: "esquinas" = con radio como favicon.svg,
     "lleno" = cuadrado completo para iOS/Android, "maskable" = la N dentro de la zona segura del 80 %).
     Colores = --tinta y --senal de public/style.css; letra = Archivo 800, ancho 125 (como .brand-emblem). -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Archivo'; font-weight: 400 800; font-stretch: 62% 125%; src: url('../../public/fuentes/archivo-latin.woff2') format('woff2'); }
html, body { margin: 0; background: transparent; }
#i { display: flex; align-items: center; justify-content: center; background: #17295C; color: #F5B800;
     font-family: 'Archivo'; font-weight: 800; font-variation-settings: 'wdth' 125; line-height: 1; }
</style></head>
<body><div id="i">N</div>
<script>
const [tam, modo] = location.hash.slice(1).split(",");
const t = Number(tam), el = document.getElementById("i");
el.style.width = el.style.height = t + "px";
el.style.fontSize = Math.round(t * (modo === "maskable" ? 0.42 : 0.6)) + "px";
el.style.paddingTop = Math.round(t * 0.04) + "px"; el.style.boxSizing = "border-box";
if (modo === "esquinas") el.style.borderRadius = Math.round(t * 6 / 64) + "px";
document.fonts.ready.then(() => { document.title = "listo"; });
</script></body></html>
